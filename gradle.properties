pluginGroup = com.github.cucumber.jetbrains.plugin
pluginName = cucumber-jetbrains-plugin
pluginVersion = 0.0.1

# Oldest supported IDE build (2026.2).
pluginSinceBuild = 262

# IDE to compile and run against. Empty: an installed IntelliJ IDEA is detected
# (%LOCALAPPDATA%\Programs\IntelliJ IDEA); otherwise IntelliJ IDEA platformVersion is downloaded.
platformLocalPath =
platformVersion = 2026.2

# Repositories, overridable in ~/.gradle/gradle.properties (e.g. with an internal mirror).
repositoryMaven = https://repo.maven.apache.org/maven2
repositoryGradlePlugins = https://plugins.gradle.org/m2
repositoryIntellij = https://cache-redirector.jetbrains.com/www.jetbrains.com/intellij-repository/releases
repositoryIntellijDependencies = https://cache-redirector.jetbrains.com/intellij-dependencies

# The IDE provides the Kotlin standard library at run time.
kotlin.stdlib.default.dependency = false
org.jetbrains.intellij.platform.selfUpdateCheck = false
org.gradle.configuration-cache = true
org.gradle.caching = true
# feature: run - the Java plugin on the compile classpath needs a larger Kotlin daemon heap.
kotlin.daemon.jvmargs = -Xmx2g
# Compile Kotlin inside the Gradle daemon instead of a separate Kotlin daemon.
# A freshly started Kotlin daemon inherits the caller's stdout pipe and wedges
# Work Panda's shell tool (code-panda <= 0.1.70; fixed upstream in code_puppy PR #988).
# In-process compilation needs the heap the Kotlin daemon used to have.
kotlin.compiler.execution.strategy = in-process
org.gradle.jvmargs = -Xmx3g -XX:MaxMetaspaceSize=1g
